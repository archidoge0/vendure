name: "ghav human: Build & Test"
"on":
  push:
    branches:
      - ghav/dev/4357
    paths:
      - .ghav/human
env:
  CI: true
jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: npm run build
  unit-tests:
    name: unit tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        node:
          - 22.x
          - 24.x
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: npx lerna run ci
      - name: Unit tests
        run: npm run test
  dashboard-e2e:
    name: dashboard e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Build
        run: npx lerna run ci
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: packages/dashboard
      - name: Install Playwright system deps
        run: npx playwright install-deps chromium
        working-directory: packages/dashboard
      - name: Dashboard e2e tests
        run: npm run e2e:pw
        working-directory: packages/dashboard
  e2e-sqljs:
    name: e2e (sqljs)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.1.1
        env:
          discovery.type: single-node
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.watermark.low: 500mb
          cluster.routing.allocation.disk.watermark.high: 200mb
          cluster.routing.allocation.disk.watermark.flood_stage: 100mb
        ports:
          - 9200
        options: --health-cmd="curl --silent --fail localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.4.1
        ports:
          - 6379
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: npx lerna run ci
      - name: e2e tests
        env:
          E2E_ELASTIC_PORT: ${{ job.services.elastic.ports['9200'] }}
          E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DB: sqljs
        run: npm run e2e
  e2e-mariadb:
    name: e2e (mariadb)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mariadb:
        image: mariadb:11.5
        env:
          MARIADB_ROOT_PASSWORD: password
        ports:
          - 3306
        options: --health-cmd="mariadb-admin ping -h localhost -u vendure -ppassword" --health-interval=10s --health-timeout=5s --health-retries=3
      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.1.1
        env:
          discovery.type: single-node
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.watermark.low: 500mb
          cluster.routing.allocation.disk.watermark.high: 200mb
          cluster.routing.allocation.disk.watermark.flood_stage: 100mb
        ports:
          - 9200
        options: --health-cmd="curl --silent --fail localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.4.1
        ports:
          - 6379
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: npx lerna run ci
      - name: e2e tests
        env:
          E2E_MARIADB_PORT: ${{ job.services.mariadb.ports['3306'] }}
          E2E_ELASTIC_PORT: ${{ job.services.elastic.ports['9200'] }}
          E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DB: mariadb
        run: npm run e2e
  e2e-mysql:
    name: e2e (mysql)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      mysql:
        image: vendure/mysql-8-native-auth:latest
        env:
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306
        options: --health-cmd="mysqladmin ping --silent" --health-interval=10s --health-timeout=20s --health-retries=10
      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.1.1
        env:
          discovery.type: single-node
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.watermark.low: 500mb
          cluster.routing.allocation.disk.watermark.high: 200mb
          cluster.routing.allocation.disk.watermark.flood_stage: 100mb
        ports:
          - 9200
        options: --health-cmd="curl --silent --fail localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.4.1
        ports:
          - 6379
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: npx lerna run ci
      - name: e2e tests
        env:
          E2E_MYSQL_PORT: ${{ job.services.mysql.ports['3306'] }}
          E2E_ELASTIC_PORT: ${{ job.services.elastic.ports['9200'] }}
          E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DB: mysql
        run: npm run e2e
  e2e-postgres:
    name: e2e (postgres)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vendure
          POSTGRES_PASSWORD: password
        ports:
          - 5432
        options: --health-cmd=pg_isready --health-interval=10s --health-timeout=5s --health-retries=3
      elastic:
        image: docker.elastic.co/elasticsearch/elasticsearch:7.1.1
        env:
          discovery.type: single-node
          bootstrap.memory_lock: true
          ES_JAVA_OPTS: -Xms512m -Xmx512m
          cluster.routing.allocation.disk.watermark.low: 500mb
          cluster.routing.allocation.disk.watermark.high: 200mb
          cluster.routing.allocation.disk.watermark.flood_stage: 100mb
        ports:
          - 9200
        options: --health-cmd="curl --silent --fail localhost:9200/_cluster/health" --health-interval=10s --health-timeout=5s --health-retries=3
      redis:
        image: redis:7.4.1
        ports:
          - 6379
    strategy:
      fail-fast: false
      matrix:
        node: ${{ github.event_name == 'pull_request' && fromJSON('["22.x"]') || fromJSON('["20.x", "22.x", "24.x"]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node-version: ${{ matrix.node }}
      - name: Build
        run: npx lerna run ci
      - name: e2e tests
        env:
          E2E_POSTGRES_PORT: ${{ job.services.postgres.ports['5432'] }}
          E2E_ELASTIC_PORT: ${{ job.services.elastic.ports['9200'] }}
          E2E_REDIS_PORT: ${{ job.services.redis.ports['6379'] }}
          DB: postgres
        run: npm run e2e
